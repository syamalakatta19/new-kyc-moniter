{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Add Customer</h1>

    <form method="POST">

        <div class="form-grid">

            <div>

                <label>Customer Number</label>

                <input
                    type="text"
                    name="customer_number"
                    placeholder="CUST001"
                    required
                >

            </div>


            <div>

                <label>Full Name</label>

                <input
                    type="text"
                    name="full_name"
                    required
                >

            </div>


            <div>

                <label>Date of Birth</label>

                <input
                    type="text"
                    name="dob"
                    placeholder="DD-MM-YYYY"
                    required
                >

            </div>


            <div>

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                >

            </div>


            <div>

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                >

            </div>


            <div>

                <label>Branch</label>

                <select name="branch_id" required>

                    <option value="">
                        Select Branch
                    </option>

                    {% for branch in branches %}

                    <option value="{{ branch.branch_id }}">

                        {{ branch.branch_name }}
                        - {{ branch.city }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div>

                <label>Account Type</label>

                <select name="account_type" required>

                    <option value="">
                        Select Type
                    </option>

                    <option value="Savings">
                        Savings
                    </option>

                    <option value="Current">
                        Current
                    </option>

                    <option value="Joint">
                        Joint
                    </option>

                </select>

            </div>


            <div>

                <label>Account Number</label>

                <input
                    type="text"
                    name="account_number"
                    placeholder="ACC1001"
                    required
                >

            </div>


            <div>

                <label>KYC Document</label>

                <select
                    name="kyc_document"
                    required>

                    <option value="">
                        Select Document
                    </option>

                    <option value="Aadhaar">
                        Aadhaar
                    </option>

                    <option value="PAN">
                        PAN
                    </option>

                    <option value="Passport">
                        Passport
                    </option>

                    <option value="Driving License">
                        Driving License
                    </option>

                    <option value="Voter ID">
                        Voter ID
                    </option>

                </select>

            </div>


            <div>

                <label>KYC Issue Date</label>

                <input
                    type="text"
                    name="kyc_issue_date"
                    placeholder="DD-MM-YYYY"
                >

            </div>


            <div>

                <label>KYC Expiry Date</label>

                <input
                    type="text"
                    name="kyc_expiry_date"
                    placeholder="DD-MM-YYYY"
                    required
                >

            </div>

        </div>


        <br>

        <button type="submit">
            Save Customer
        </button>

        <a
            href="{{ url_for('customers') }}"
            class="btn secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
